[package]
name = "security_rag"
version = "0.1.0"
edition = "2021"
publish = false

[lints.rust]
# keep simple; no workspace inheritance
unsafe_code = "forbid"

[dependencies]
rig = { version = "0.46", features = ["derive", "pdf"] }
anyhow = "1"
dotenvy = "0.15"
rig-lancedb = "0.46"
lancedb = { version = "0.30", default-features = false }
arrow-array = "58"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
